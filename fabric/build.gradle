plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    include 'io.github.jaredmdobson:concentus:1.0.2'

    // Pure-Java MP3 decoding (mp3spi -> JLayer); WAV is handled by the JDK. Bundled via
    // Fabric's jar-in-jar (include) so MP3/WAV import needs no external ffmpeg. List all
    // three explicitly so each is nested in the jar.
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    include 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    include 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    include 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'
}
fabricApi {
    configureDataGeneration()
}
loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
            programArgs "--username", "dev"
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
