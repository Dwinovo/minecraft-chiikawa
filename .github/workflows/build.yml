name: Build

# 只回答一个问题:git 里的东西能不能编译、测试能不能过、数据生成能不能跑。
# 发版(publish.yml)认的就是这里对被发那个提交的结论,自己不再跑一遍。
#
# runner 上只有被跟踪的文件:本机多出来的、被 .gitignore 裸 build 规则吞掉的源码,在这里必然暴露。
#
# 只挂本分支:每条 MC 版本分支各有一份,各守各的。
on:
  push:
    branches: ["1.21.11"]
  pull_request:
    branches: ["1.21.11"]
  workflow_dispatch:

# 连着推几次时只留最后一次。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 逐分支不同(1.20.x -> 17,1.21.x -> 21,26.1.2 -> 25),从 gradle.properties 读,工作流本身不改。
      - name: Read target JDK from gradle.properties
        id: props
        shell: bash
        run: |
          echo "java_version=$(grep -E '^java_version=' gradle.properties | head -n1 | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Setup Java ${{ steps.props.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.props.outputs.java_version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # assemble = 全部模块出 jar,不点名 loader——Forge/NeoForge 分支同一份步骤。
      - name: Assemble all loaders
        run: ./gradlew assemble --no-daemon -x javadoc

      # 语言文件、标签、物品模型都是生成出来的,不跑就发现不了 provider 改坏了。
      - name: Run data generation
        run: ./gradlew datagenAll --no-daemon -x javadoc

      # 纯 JVM 测试,不起游戏。
      - name: Run JVM tests
        run: ./gradlew test --no-daemon -x javadoc

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: "**/build/reports/tests/test/"
          retention-days: 7
