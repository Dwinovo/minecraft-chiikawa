plugins {
    id 'eclipse'
    id 'idea'
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = project.version
group = project.group

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }
        // Headless batch of the in-game cases: ./gradlew :forge:runGameTestServer
        // Its exit code is the number of failures, so CI reads it without parsing a log.
        // No forge.enabledGameTestNamespaces: from Forge 48 on it keeps only batches named
        // "<namespace>.<batch>", and the cases' batches go unprefixed so their floors are
        // found as chiikawa:floor16 (see GameTestKit). The mod's cases are the only ones here.
        gameTestServer {
            workingDirectory project.file('runs/gametestserver')
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing', project(':common').file('src/main/resources/').getAbsolutePath()
        }
    }
}

// Vanilla lays the GameTest floors at y=-60, the top of the superflat world its own test
// server makes. Forge 1.20.4 starts that server on the world server.properties describes,
// a normal one by default, which puts every case in a pocket dug deep underground: no sky,
// and water and gravel breaking in from the caves around it. So the run is handed the flat
// world vanilla means, made afresh each time so nothing from the last run is still about.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        def runDir = file('runs/gametestserver')
        delete new File(runDir, 'world')
        runDir.mkdirs()
        new File(runDir, 'server.properties').text = 'level-type=minecraft\\:flat\n'
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources.srcDir 'src/generated/resources'

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    // Pure-Java audio decode libraries. `implementation` puts them on the compile + dev
    // runtime classpath (common references concentus/mp3spi directly); `jarJar` nests them
    // into the published Forge jar so MP3/WAV import works without an external ffmpeg.
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    implementation 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    implementation 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'

    // transitive = false: we nest exactly these four artifacts and nothing else (otherwise
    // soundlibs drag in a test-scoped junit 3.8.2 that would get bundled into the mod jar).
    jarJar(group: 'io.github.jaredmdobson', name: 'concentus', version: '[1.0.2,2.0)') { transitive = false }
    jarJar(group: 'com.googlecode.soundlibs', name: 'mp3spi', version: '[1.9.5.4,2.0)') { transitive = false }
    jarJar(group: 'com.googlecode.soundlibs', name: 'jlayer', version: '[1.0.1.4,2.0)') { transitive = false }
    jarJar(group: 'com.googlecode.soundlibs', name: 'tritonus-share', version: '[0.3.7.4,1.0)') { transitive = false }
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}
