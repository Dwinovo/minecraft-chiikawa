// chiikawa-anim:动画引擎,纯 JVM——classpath 里没有 Minecraft,"零 MC import"由编译器保证,
// 不靠自觉。引擎认识的只有骨骼、关键帧和一帧里的几个数;哪只宠物、哪个资源包、哪套渲染 API,
// 一概不认识。这些由 common 里的适配层补上,每个 MC 版本一份,引擎本身在所有版本分支上逐字节相同。
//
// 住户:Bedrock 文件格式 format、Molang 解析与求值 molang、烘焙后的数据 baked 与烘焙器 compile、
// 采样与混合 runtime、控制器与动画器 controller、姿态的合成(输入、拦截器、可见性) pose。
//
// 能用的库只有每个受支持的 MC 版本都自带的:Gson、JOML、slf4j-api。版本钉在最老的一份(1.20.1)
// 够用的位置,只编译不打包——运行时由游戏给。
//
// 和 common、ui 一样按源码并入两个 loader 的 jar(见 multiloader-loader.gradle),
// 不额外打包一个库,也就没有 jar-in-jar 那套。
plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-anim"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.joml:joml:1.10.5'
    compileOnly 'org.slf4j:slf4j-api:2.0.1'

    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.joml:joml:1.10.5'
    testImplementation 'org.slf4j:slf4j-api:2.0.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// 供 loader 以源码方式并入,和 common 的 commonJava 同一套做法。
configurations {
    animJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    animJava sourceSets.main.java.sourceDirectories.singleFile
}
