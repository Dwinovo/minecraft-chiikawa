plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    maven { url = "https://api.modrinth.com/maven" }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // Explicitly target this mod for datagen and point existing assets to common.
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('common/src/main/resources').getAbsolutePath()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    localRuntime
    runtimeClasspath {
        extendsFrom localRuntime
    }
}

dependencies {
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    jarJar 'io.github.jaredmdobson:concentus:1.0.2'

    // Pure-Java MP3 decoding (mp3spi -> JLayer); WAV is handled by the JDK. Bundled via
    // jar-in-jar so MP3/WAV import needs no external ffmpeg. mp3spi pulls jlayer +
    // tritonus-share transitively for dev; list all three for jarJar so they ship in the jar.
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    jarJar 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    jarJar 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    jarJar 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'

    // In a dev run the jar-in-jar libraries aren't nested into the mod, so the mod module
    // can't load their classes (NoClassDefFoundError). Put them on the dev runtime classpath
    // explicitly so MP3 decode is testable in :neoforge:runClient too.
    additionalRuntimeClasspath 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    additionalRuntimeClasspath 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    additionalRuntimeClasspath 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
